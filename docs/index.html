<!doctype html>
<html lang="no">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Brannspillet</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #20231f;
        --muted: #65706a;
        --paper: #f6f6f1;
        --panel: #ffffff;
        --line: #d9ddd3;
        --red: #b8162c;
        --deep-red: #78101c;
        --green: #216b4d;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        color: var(--ink);
        background:
          linear-gradient(135deg, rgba(184, 22, 44, 0.14), transparent 36%),
          linear-gradient(160deg, transparent 48%, rgba(33, 107, 77, 0.14)),
          var(--paper);
      }

      main {
        display: grid;
        width: min(920px, calc(100% - 32px));
        min-height: 100vh;
        margin: 0 auto;
        padding: 28px 0;
        align-content: center;
        gap: 24px;
      }

      .eyebrow {
        margin: 0 0 6px;
        color: var(--deep-red);
        font-size: 0.78rem;
        font-weight: 900;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.2rem, 3rem, 3.4rem);
        line-height: 1;
        letter-spacing: 0;
      }

      p {
        margin: 0;
      }

      .games {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
      }

      a {
        display: grid;
        min-height: 152px;
        padding: 18px;
        align-content: space-between;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: inherit;
        background: rgba(255, 255, 255, 0.94);
        box-shadow: 0 14px 34px rgba(32, 35, 31, 0.08);
        text-decoration: none;
      }

      a:hover,
      a:focus-visible {
        border-color: var(--red);
      }

      strong {
        color: var(--red);
        font-size: 1.35rem;
      }

      small {
        color: var(--muted);
        font-weight: 750;
      }

      @media (max-width: 680px) {
        main {
          width: min(100% - 20px, 920px);
          padding: 16px 0;
        }

        .games {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">Brannspillet beta</p>
        <h1>Brannspillet</h1>
      </header>

      <section class="games" aria-label="Velg spill">
        <a href="./hvem-mangler/">
          <strong>Hvem mangler?</strong>
          <small>Finn spilleren som er tatt ut av startelleveren.</small>
        </a>

        <a href="./tenable/">
          <strong>Tenable</strong>
          <small>Finn alle spillerne i en topp 10-liste.</small>
        </a>

        <a href="./brann-sudoku/">
          <strong>Brann-sudoku</strong>
          <small>Fyll 3x3-rutenettet med riktige Brann-spillere.</small>
        </a>
      </section>
    </main>
  </body>
</html>
